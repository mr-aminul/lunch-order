<html>
<head>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Poppins',sans-serif}
body{background:#e8e6e1;display:flex;justify-content:center;align-items:flex-start;padding:24px}
.card{background:#fff;width:420px;border-radius:20px;padding:28px 24px 20px;box-shadow:0 2px 16px rgba(0,0,0,0.10)}
.logo img{height:48px;object-fit:contain}
.title{font-size:44px;font-weight:900;color:#000;letter-spacing:0.5px;line-height:1.05;margin-top:10px}
.date{font-size:14px;font-weight:700;color:#ee1d3f;letter-spacing:0.5px;margin-top:2px;margin-bottom:18px}
.google-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:11px 20px;border:1.5px solid #dadce0;border-radius:8px;background:#fff;cursor:pointer;margin-bottom:20px;transition:background 0.15s}
.google-btn:hover{background:#f8f8f8}
.google-icon{width:20px;height:20px;flex-shrink:0}
.google-btn span{font-size:15px;color:#3c4043;font-weight:500}
.meal-cards{display:flex;gap:12px;margin-bottom:14px}
.meal-card{flex:1;background:#111;border-radius:16px;padding:18px 16px 22px;cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;transition:transform 0.12s;min-height:110px;justify-content:center}
.meal-card:hover{background:#222;transform:scale(1.02)}
.meal-card.selected{outline:3px solid #ee1d3f}
.meal-badge{position:absolute;top:-10px;left:50%;transform:translateX(-50%);width:28px;height:28px;background:#ee1d3f;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;border:2.5px solid #fff;z-index:2}
.meal-name{color:#fff;font-size:30px;font-weight:800;margin-top:8px}
.cancel-btn{width:100%;background:#ee1d3f;border:none;border-radius:14px;padding:17px;color:#fff;font-size:18px;font-weight:800;letter-spacing:2.5px;cursor:pointer;margin-bottom:14px;transition:background 0.15s}
.cancel-btn:hover{background:#cc1535}
.cancel-btn.confirm{background:#1a8a3a}
.footer-note{text-align:center;font-size:11.5px;color:#999}
.footer-note strong{color:#777;font-weight:600}
</style>

<div style="display:flex;justify-content:center;padding:20px;background:#e8e6e1;min-height:100%">
<div class="card">
  <div class="logo">
    <img src="https://careers.recruiteecdn.com/image/upload/q_auto,f_auto,w_400,c_limit/production/images/BsZN/-fDVhjUjc-Xo.png" alt="NEXT Ventures" />
  </div>

  <div class="title">LUNCH ORDER</div>
  <div class="date">SATURDAY (4 APRIL 2026)</div>

  <button class="google-btn" onclick="handleGoogle()">
    <svg class="google-icon" viewBox="0 0 48 48">
      <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
      <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
      <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
      <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      <path fill="none" d="M0 0h48v48H0z"/>
    </svg>
    <span>Continue with Google</span>
  </button>

  <div class="meal-cards">
    <div class="meal-card" id="card-chicken" onclick="selectMeal('chicken')">
      <div class="meal-badge">1</div>
      <div class="meal-name">Chicken</div>
    </div>
    <div class="meal-card" id="card-fish" onclick="selectMeal('fish')">
      <div class="meal-badge">2</div>
      <div class="meal-name">Fish</div>
    </div>
  </div>

  <button class="cancel-btn" id="main-btn" onclick="handleCancel()">CANCEL</button>

  <div class="footer-note">Last time to place an order is <strong>9AM (5 APRIL 2026)</strong></div>
</div>
</div>

<script>
let isOrderCooldown = false;
let orderResetTimer = null;

function handleGoogle() {
  const btn = document.querySelector('.google-btn');
  btn.innerHTML = '<span style="color:#3c4043;font-weight:500">✓ Signed in with Google</span>';
  btn.style.background = '#f0faf0';
  btn.style.borderColor = '#34A853';
  btn.disabled = true;
}

function placeOrderFeedback(mealType) {
  if (isOrderCooldown) return;
  isOrderCooldown = true;
  const btn = document.getElementById('main-btn');
  const label = mealType === 'chicken' ? 'CHICKEN' : 'FISH';
  btn.textContent = '✓ ' + label + ' ORDER PLACED!';
  btn.classList.add('confirm');
  btn.style.background = '';
  document.getElementById('card-chicken').classList.remove('selected');
  document.getElementById('card-fish').classList.remove('selected');
  if (orderResetTimer) clearTimeout(orderResetTimer);
  orderResetTimer = setTimeout(() => {
    isOrderCooldown = false;
    orderResetTimer = null;
    btn.textContent = 'CANCEL';
    btn.classList.remove('confirm');
  }, 2500);
}

function selectMeal(type) {
  if (isOrderCooldown) return;
  placeOrderFeedback(type);
}

function handleCancel() {
  const btn = document.getElementById('main-btn');
  if (orderResetTimer) {
    clearTimeout(orderResetTimer);
    orderResetTimer = null;
  }
  isOrderCooldown = false;
  document.getElementById('card-chicken').classList.remove('selected');
  document.getElementById('card-fish').classList.remove('selected');
  btn.textContent = 'CANCEL';
  btn.style.background = '';
  btn.classList.remove('confirm');
}
</script>
</body>
</html>
